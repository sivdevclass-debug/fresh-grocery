{% extends "base.html" %}
{% block title %}Login - FreshGrocery{% endblock %}
{% block content %}
<div class="container auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">🌿</div>
            <h1>Welcome Back</h1>
            <p>Sign in to your FreshGrocery account</p>
        </div>
        <form method="post">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="username"><i class="bi bi-person"></i> Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password"><i class="bi bi-lock"></i> Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Sign In <i class="bi bi-arrow-right"></i></button>
        </form>
        <div class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('register') }}">Sign up here</a></p>
        </div>
    </div>
</div>
{% endblock %}
